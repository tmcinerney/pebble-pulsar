name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Cachix
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install Devenv
        run: nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Run Firmware & Configuration Tests
        run: |
          devenv shell -- python3 tests/test_firmware.py

      - name: Build Monorepo Suite Bundles
        run: |
          devenv shell -- python3 scripts/build_all.py
          python3 scripts/validate_pbw.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pbw
          generate_release_notes: true
          draft: false
          prerelease: false
