name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Cachix
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install Devenv & Build
        uses: cachix/devenv-action@v1.4
        with:
          run: |
            pebble clean
            pebble build
            python3 scripts/validate_pbw.py build/pebble-pulsar.pbw

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/pebble-pulsar.pbw
          generate_release_notes: true
          draft: false
          prerelease: false
