name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-validate:
    name: Build & Validate PBW
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Cachix
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install Devenv
        uses: cachix/devenv-action@v1.4
        with:
          run: |
            echo "Building Pebble Universal Bundle (emery, basalt, diorite, aplite)..."
            pebble build
            python3 scripts/validate_pbw.py build/pebble-pulsar.pbw

      - name: Upload PBW Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pebble-pulsar.pbw
          path: build/pebble-pulsar.pbw
          retention-days: 14
