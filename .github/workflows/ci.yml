name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-validate:
    name: Build & Validate PBW
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Cachix
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install Devenv
        run: nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Run Firmware & Configuration Tests
        run: |
          devenv shell -- python3 tests/test_firmware.py

      - name: Build Universal Pebble Bundle
        run: |
          devenv shell -- pebble clean
          devenv shell -- pebble build
          python3 scripts/validate_pbw.py build/pebble-pulsar.pbw

      - name: Upload PBW Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pebble-pulsar.pbw
          path: build/pebble-pulsar.pbw
          retention-days: 14
